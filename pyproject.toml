[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brethof-brain-client"
version = "1.1.0"
description = "Thin client for brethof-brain cloud — shared long-term memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Brethof AI", email = "hello@brethof.ai" }]
keywords = ["claude", "claude-code", "memory", "mcp", "agents"]
# Source-available, not OSI open-source — see LICENSE (brethof-brain Client License).
license = { text = "LicenseRef-brethof-brain-Client-License" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
# No runtime dependencies — stdlib only, by design.
dependencies = []

[project.urls]
Homepage = "https://brethof.cloud"
Service = "https://api.brethof.cloud"

[project.scripts]
brethof-brain = "brethof_brain_client.cli:main"
brethof-brain-hook = "brethof_brain_client.hook:main"

[tool.setuptools]
packages = ["brethof_brain_client"]

[tool.pytest.ini_options]
markers = ["slow: live multi-minute conformance runs (deselect with -m 'not slow')"]
