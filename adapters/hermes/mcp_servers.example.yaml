# Drop this under `mcp_servers:` in your Hermes cli-config.yaml.
# Hermes auto-discovers the brethof-brain tools from this one HTTP MCP
# server — the toolset matches your key (panel keys see the standard
# intent tools; full-access keys the extended set). tools/list is truth.
mcp_servers:
  brethof-brain:
    url: https://api.brethof.cloud/v1/mcp
    headers:
      # Your brethof-brain API key (from brethof.ai/account → Memory tab).
      # Keep this config private; prefer ~/.hermes/.env for the secret.
      Authorization: "Bearer bm_live_REPLACE_ME"
    timeout: 60          # per-tool-call timeout (s)
    connect_timeout: 30  # initial connection timeout (s)
