# grok-build adapter — MCP server config example

# Grok Build stores MCP servers in ~/.grok/config.toml (added via `grok mcp add`).
# This file is a reference for what the setup script configures.
#
# To add manually:
#   grok mcp add --transport http brethof-brain http://127.0.0.1:8600/v1/mcp \
#     --header "Authorization: Bearer bd_..."
#
# (the hub's address, or https://<your hub>/v1/mcp; bd_... is the device key
# `brethof-brain pair` saved — `brethof-brain mcp-command` prints it in a line)
#
# Or in ~/.grok/config.toml under [[mcp.servers]]:
#
# [[mcp.servers.brethof-brain]]
# transport = "http"
# url = "http://127.0.0.1:8600/v1/mcp"
# 
# [mcp.servers.brethof-brain.headers]
# Authorization = "Bearer bd_..."
#
# Verify: grok mcp doctor
#
# Tools: the server lists the toolset your key is entitled to — do not
# hard-code names. A device key sees the standard set (list_projects,
# save_project, save_general, save_rule,
# search_brain, search_history, list_brain, get_record, delete_record,
# cleanup_history, list_rules); a full-access key sees the extended set.
# Either way `tools/list` is the truth. (Deleting a whole project is done
# on the hub, not from an agent.)