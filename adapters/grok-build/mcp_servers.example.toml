# grok-build adapter — MCP server config example

# Grok Build stores MCP servers in ~/.grok/config.toml (added via `grok mcp add`).
# This file is a reference for what the setup script configures.
#
# To add manually:
#   grok mcp add --transport http brethof-mind https://api.brethof.cloud/v1/mcp \
#     --header "Authorization: Bearer bm_live_REPLACE_ME"
#
# Or in ~/.grok/config.toml under [[mcp.servers]]:
#
# [[mcp.servers.brethof-mind]]
# transport = "http"
# url = "https://api.brethof.cloud/v1/mcp"
# 
# [mcp.servers.brethof-mind.headers]
# Authorization = "Bearer bm_live_REPLACE_ME"
#
# Verify: grok mcp doctor
#
# Tools: the server lists the toolset your key is entitled to — do not
# hard-code names. A panel-minted key sees the standard set (list_projects,
# save_project, save_general, save_project_rule, save_general_rule,
# search_memory, search_history, list_memory, get_memory, delete_memory,
# delete_project, cleanup_history, list_rules); a full-access key sees the
# extended set. Either way `tools/list` is the truth.